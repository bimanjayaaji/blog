    caption: "warm was the morning. the moment i fixed my eyes on the scene, i knew i will have this on my film. two trunks of trees at the background are bending toward the west. but the one on the front is facing to the east, embracing the morning sunlight. i thought it was beautiful and convey some kind of message."

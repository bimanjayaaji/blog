    caption: "we had a short trip to jogja and had a chance to visit gramedia sudirman (or soedirman?). it was nice, and this photo is an iconic one. if you look closer (and familiar with books!), you'll realize that this smiling pretty lady is holding a book with a sad and depressed looking man on the cover. written by osamu dazai titled 'no longer human' or 'gagal menjadi manusia'. so allegorical :D this photo is practically all of us, wkwkw"

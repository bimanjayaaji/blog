  - image: ../../assets/galleries/lof/pano-29.jpg
  - image: ../../assets/galleries/lof/pano-10.jpg
    caption: "my beloved napping. this photo never fails to remind me about the experience of taking a picture using an SLR film camera. it slows you down, forcing you to take your time.. with your subject. with the composition. with your environment. with the natural light present around you. it even makes you think about the physics of light intensity and the photons. seriously. and when you get to see the result, it washed over you again.. the deep longing of you wanting to make that particular moment lives on. [[it took me around 5 to 10 minutes to observe-plan-capture this single photo. and it was fun!]]"
